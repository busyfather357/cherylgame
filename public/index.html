<head>

    <meta name="keywords" content="數學遊戲, RPG數學, Math Game, 親子共學, 兒童數學練習, 加減乘法練習">

    <meta property="og:description" content="勇者，準備好接受數學挑戰了嗎？擊敗怪物並解開謎題，讓練習數學變成一場大冒險！">
    <meta property="og:image" content="https://mathrpg.mumuisland.com/screenshot.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "RPG Math Challenge",
      "operatingSystem": "Web",
      "applicationCategory": "GameApplication",
      "genre": "Educational Game",
      "description": "這是一款結合 RPG 角色扮演與數學運算的教育遊戲，旨在幫助兒童透過遊戲化學習提升數學運算能力。",

      gtag('js', new Date());
      gtag('config', 'G-SNXESQ5BC1');

    <link rel="stylesheet" href="style.css"> 
</head> 
<body>     
    <div id="hud">         
        <div class="hp-container" id="hp-display">             
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>     
        </div>         
        <div class="level" id="level-display">Level: 1</div>         
        <div class="score" id="score-display">Score: 0</div>     
        <div id="inventory-bar">
            <span id="inv-potion" class="inv-item">🧪 x0</span>
            <span id="inv-boots" class="inv-item">🥾 x0</span>
            <span id="inv-scroll" class="inv-item">📜 x0</span>
            <span id="inv-shield" class="inv-item">🛡️ x0</span>
        </div>
    </div>     
    <div id="mobile-controls">         
        <div class="dpad">             
            <div class="dpad-btn" id="btn-up">⬆️</div>
            <div class="dpad-btn" id="btn-down">⬇️</div>
            <div class="dpad-btn" id="btn-left">⬅️</div>
            <div class="dpad-btn" id="btn-right">➡️</div>     
        </div>         
        <div class="action-btn-container">             
            <div class="action-btn" id="btn-action">Action</div>         
        </div>     
        <div class="item-btn-container">
            <div class="item-btn" id="btn-item-1">🧪</div>
            <div class="item-btn" id="btn-item-2">🥾</div>
            <div class="item-btn" id="btn-item-3">📜</div>
            <div class="item-btn" id="btn-item-4">🛡️</div>
        </div>
    </div>     
    <div id="math-modal-overlay">         
        <div id="math-modal">             
            <h2 id="math-title">Math Challenge!</h2>             
            <div id="math-question">5 + 7 = ?</div>             
            <div class="answers-grid" id="answers-container">
                <!-- Answer buttons will be generated here -->
            </div>
            <button id="hint-btn" class="hint-btn" type="button" style="display: none;">📜 Hint Scroll (x0)</button>
            <div id="math-feedback"></div>
        </div>     
    </div>     
    <canvas id="game"></canvas>     
    <script src="script.js"></script> 
</body> 
</html>
